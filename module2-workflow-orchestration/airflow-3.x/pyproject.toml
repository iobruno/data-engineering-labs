[project]
name = "airflow3-playground"
version = "1.0"
description = "Workflow orchestration with Airflow 3.1"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "apache-airflow>=3.1,<3.2",                     # Pins to 3.1.x
    "apache-airflow-providers-standard>=1.12,<1.13", # PythonOperator/BashOperator etc. moved out of airflow-core in 3.x
    "sqlalchemy>=2.0,<3.0",                          # Airflow 3.x requires SQLAlchemy 2.x
    "psycopg[binary]==3.3.4",                        # Airflow's own metastore driver (postgresql+psycopg); "psycopg-binary" alone omits the psycopg package itself
    "asyncpg>=0.31,<0.40",                           # Airflow 3.x's core ORM always opens an async (postgresql+asyncpg) session, regardless of executor
    "pandas>=3.0.0,<4.2.0",
    "polars>=1.38.0,<2.0",
    "pyarrow>=23.0,<24.0",
    "adbc-driver-manager>=1.10.0,<2.0",
    "adbc-driver-postgresql>=1.10.0,<2.0",
]

[project.optional-dependencies]
gcp = [
    "apache-airflow-providers-google>=20.0,<20.1",  # Airflow 3.1
]
fab = [
    "apache-airflow-providers-fab>=3.4,<3.5",       # FabAuthManager: preserves 2.x-style basic-auth login
]
venv = [
    "virtualenv>=20.29,<21.0",                      # Required for PythonVirtualenvOperator (no longer an airflow extra in 3.x)
    "cloudpickle>=3.1.1,<4.0",                      # Required for PythonVirtualenvOperator
]
celery = [
    "apache-airflow-providers-celery>=3.17,<3.18",  # required for CeleryExecutor / Airflow 3.1
    "apache-airflow-providers-redis>=4.4,<4.5",     # required for CeleryExecutor / Airflow 3.1
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[tool.setuptools.packages.find]
exclude = ["config", "dags", "logs", "plugins"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = false
preview = true  # unstable: enables 'hug_parens_with_braces_and_square_brackets' for compact StructType([...])

[tool.ruff.lint]
preview = true  # unstable: enables latest lint rules before stabilization
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax for newer Python)
    "B",    # flake8-bugbear (common bug patterns)
    "SIM",  # flake8-simplify (code simplification)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "RUF013",  # implicit Optional
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # allow imports not at top in notebooks
