name: 'dbt_bigquery_analytics'

config-version: 2
version: '2.0'

profile: 'dbt_bigquery_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_bigquery_analytics:
    staging:
      +materialized: view
    core:
      +materialized: table

  # Sets schema for elementary-data's metadata tables, otherwise it defaults to target.schema
  # Docs: https://docs.elementary-data.com/data-tests/dbt/dbt-package
  elementary:
    +schema: elementary
