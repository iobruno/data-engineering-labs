x-duckdb-image: &duckdb-image duckdb/duckdb:${DUCKDB_VERSION:-1.5.5}

services:
  duckdb-server:
    image: *duckdb-image
    container_name: duckdb-server
    command: |
      /duckdb /data/catalog.ducklake
    stdin_open: true
    environment:
      HOME: /data  # auto-loads /data/.duckdbrc on startup (the mounted quack/init.sql)
      QUACK_TOKEN: "${QUACK_TOKEN:-quack}"
    ports:
      - "9494:9494"
    volumes:
      - ./quack/init.sql:/data/.duckdbrc:ro
      - vol-duckdb-catalog:/data
    healthcheck:
      test: ["CMD", "/duckdb", "-c", "SELECT 1"] # CMD-SHELL runs via /bin/sh -c, which doesn't exist in this distroless image
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  duckdb-ui:
    image: *duckdb-image
    container_name: duckdb-ui
    command: |
      /duckdb
      -init /data/client_init.sql
      -cmd 'INSTALL ui; LOAD ui; CALL start_ui();'
    stdin_open: true
    environment:
      HOME: /data  # extensions install under $HOME/.duckdb
    volumes:
      - ./quack/client_init.sql:/data/client_init.sql:ro
      - ${DBT_DUCKLAKE_DATA_PATH:-$HOME/.duckdb/warehouse}:${DBT_DUCKLAKE_DATA_PATH:-$HOME/.duckdb/warehouse}:ro
    depends_on:
      duckdb-server:
        condition: service_healthy
    network_mode: host
    restart: on-failure

volumes:
  vol-duckdb-catalog:
    name: vol-duckdb-catalog
