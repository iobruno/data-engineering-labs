[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-tlc-cli"
version = "2.3"
description = "Headless CLI for processing the NYC TLC Dataset"
readme = "README.md"
requires-python = ">=3.12,<3.16"

dependencies = [
    "typer>=0.27.3,<1.0",
    "polars>=2.1.0,<3.0",
    "pandas>=3.1.0,<4.0",
    "pyarrow>=26.0.0,<27.0",
    "adbc-driver-postgresql>=1.13.0,<2.0",
    "adbc-driver-manager>=1.13.0,<2.0",
    "psycopg[binary]>=3.3.6,<4.0",
    "sqlalchemy>=2.1.6,<3.0",
    "python-box[yaml]>=7.4.1,<8.0",
    "loguru>=0.7.3,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "jupyterlab>=4.6.5",
]

[project.scripts]
tlc = "app.command:cli"

[tool.hatch.build.targets.wheel]
include = ["app/**"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = false
preview = true  # unstable: enables 'hug_parens_with_braces_and_square_brackets' for compact StructType([...])

[tool.ruff.lint]
preview = true  # unstable: enables latest lint rules before stabilization
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize syntax for newer Python)
    "B",    # flake8-bugbear (common bug patterns)
    "SIM",  # flake8-simplify (code simplification)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "RUF013",  # implicit Optional
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # allow imports not at top in notebooks
"app/schemas.py" = ["RUF012"]  # Schema.fields are declarative class-level lists, never mutated
